# AgentCorp 模型服务编排（一键起）
# 用法：
#   cd model-service
#   docker compose up --build
# 无 NPU 演示：MOCK=true（默认）
# 真实部署：MOCK=false；若使用异构加速卡需按厂商文档透传对应设备节点
services:
  agentcorp-model:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentcorp-minicpmo:ascend
    container_name: agentcorp-model
    # 只映射到本机回环：容器内仍需 API_HOST=0.0.0.0（端口映射才能进来），
    # 但宿主侧不暴露到局域网。确需对外时改为 "8000:8000" 并自行加前置鉴权。
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MOCK=${MOCK:-true}
      - MODEL_PATH=/models/MiniCPM-o-4.5
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SAMPLES_DIR=/app/samples
      - UPLOAD_DIR=/app/uploads
    volumes:
      # 固定候选样本集（含真实媒体，部署时置入）
      - ../samples:/app/samples
      - ./uploads:/app/uploads
    # 异构加速卡设备透传（按需取消注释，设备节点名以厂商文档为准）
    # devices:
    #   - /dev/davinci0:/dev/davinci0
    #   - /dev/davinci_manager:/dev/davinci_manager
    restart: unless-stopped
