name: CI

on:
  push:
    branches:
      - main
      - 'feat/*'
  pull_request:

jobs:
  frontend:
    name: Frontend gates (typecheck / lint / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test

  model-service:
    name: model-service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            model-service/requirements.txt
            model-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r model-service/requirements.txt -r model-service/requirements-dev.txt

      - name: Run pytest
        run: cd model-service && python -m pytest tests/ -q
